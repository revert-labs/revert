<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" role="img" aria-labelledby="title desc">
  <title id="title">Revert Labs</title>
  <desc id="desc">git for AI agent actions — every action is a commit, anything can be rolled back.</desc>

  <!-- card -->
  <rect x="0" y="0" width="380" height="240" rx="16" fill="#131722" stroke="#263044" stroke-width="1"/>

  <!-- the box (the loop) -->
  <line x1="70" y1="40" x2="120" y2="40" stroke="#e6e9f0" stroke-width="2"/>
  <line x1="70" y1="40" x2="70" y2="140" stroke="#e6e9f0" stroke-width="2"/>
  <line x1="118" y1="40" x2="118" y2="166" stroke="#e6e9f0" stroke-width="2"/>

  <!-- top commit dot -->
  <circle cx="250" cy="46" r="7" fill="#4ade80"/>

  <!-- stem down from the top dot -->
  <line x1="250" y1="54" x2="250" y2="84" stroke="#e6e9f0" stroke-width="2"/>

  <!-- horizontal A: stem -> middle column -->
  <line x1="185" y1="84" x2="250" y2="84" stroke="#e6e9f0" stroke-width="2"/>

  <!-- middle column -->
  <line x1="185" y1="84" x2="185" y2="140" stroke="#e6e9f0" stroke-width="2"/>

  <!-- horizontal B: box bottom -> middle column -->
  <line x1="70" y1="140" x2="185" y2="140" stroke="#e6e9f0" stroke-width="2"/>

  <!-- bottom commit dot -->
  <circle cx="119" cy="178" r="7" fill="#4ade80"/>

  <!-- labels -->
  <text x="268" y="50" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#e6e9f0">← commit</text>
  <text x="203" y="145" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#e6e9f0">← the branch returns</text>

  <!-- tagline -->
  <text x="190" y="215" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#f4f6fa" letter-spacing="0.5">revert - every action is a commit</text>
</svg>
