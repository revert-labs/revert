docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "**/*.md"
core:
  - changed-files:
      - any-glob-to-any-file: "src/**/*"
test:
  - changed-files:
      - any-glob-to-any-file: "test/**/*"
ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"
branding:
  - changed-files:
      - any-glob-to-any-file: "docs/branding/**/*"
